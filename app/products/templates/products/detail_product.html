{% extends 'base.html' %}

{% block content %}
<div class="page-intro">
    <p class="eyebrow">Каталог · Товар №{{ product.id }}</p>
    <h1>{{ product.name }}</h1>
</div>
<article class="project-card">
    <h2>Опис товару</h2>
    <p>{{ product.content }}</p>
    <p class="product-price">Ціна: {{ product.price }}</p>
    <a class="text-link" href="{{ url_for('products.index') }}">Усі товари <span aria-hidden="true">↗</span></a>
</article>
{% endblock %}
