{% extends 'base.html' %}

{% block content %}
{% if notice %}
<div class="alert alert-success" role="alert">{{ notice }}</div>
{% endif %}
<div class="page-intro">
    <p class="eyebrow">Особиста сторінка · Користувачі</p>
    <h1>{{ title }}</h1>
    <p class="intro-description">Увійдіть, щоб відкрити свій профіль.</p>
</div>
<div class="row">
    <div class="col-md-8 col-lg-6">
        <form class="form-card" method="post" action="{{ url_for('users.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="username">Ім’я користувача</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Увійти</button>
        </form>
    </div>
</div>
{% endblock %}
